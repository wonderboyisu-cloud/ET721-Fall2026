<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Form</title>
    <link rel="stylesheet" href="{{url_for('static', filename = 'style.css')}}">
</head>
<body>
    <h1 class="title">Isaam Shah</h1>
    <main class="container">
        <h2>Increase Salary</h2>
        <form method="POST" action="/">
            <div>
                <label for="employeename">Employee Name: </label>
                <input type="text" name="name" id="employeename" maxlength="50" required>
            </div>

            <div>
                <label for="employeeid">Employee ID: </label>
                <input type="number" name="id" id="employeeid" min="0" max="99" required>
            </div>

            <div>
                <label for="employeesalary">Employee Salary: </label>
                <input type="number" name="salary" id="employeesalary" min="0" max="999999" required>
            </div>

            <div>
                <button type="submit">Increase Salary</button>
            </div>
        </form>
        
        {% if msg %}
            <div class="dbmsg">
                <p>{{msg}}</p>
            </div>
        {% endif %}
    </main>

    <footer class="footer">
        Mini Form App @ October 2026 by Isaam Shah
    </footer>
</body>
</html>
